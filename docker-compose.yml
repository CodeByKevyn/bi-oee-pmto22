name: bi-oee

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    ports:
      - "${PGPORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/01_esquemas.sql:/docker-entrypoint-initdb.d/01_esquemas.sql:ro
      - ./sql/02_staging.sql:/docker-entrypoint-initdb.d/02_staging.sql:ro
      - ./sql/03_dimensiones.sql:/docker-entrypoint-initdb.d/03_dimensiones.sql:ro
      - ./sql/04_hechos.sql:/docker-entrypoint-initdb.d/04_hechos.sql:ro
      - ./sql/05_tiempo_real.sql:/docker-entrypoint-initdb.d/05_tiempo_real.sql:ro
      - ./sql/06_indices.sql:/docker-entrypoint-initdb.d/06_indices.sql:ro
      - ./sql/07_vistas.sql:/docker-entrypoint-initdb.d/07_vistas.sql:ro
      - ./sql/10_tiempo_real_vistas.sql:/docker-entrypoint-initdb.d/10_tiempo_real_vistas.sql:ro
      - ./sql/11_permisos.sql:/docker-entrypoint-initdb.d/11_permisos.sql:ro
      - ./docker/12_usuario_grafana.sh:/docker-entrypoint-initdb.d/12_usuario_grafana.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana-oss:13.2.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # carga el modelo desde el Excel una vez y termina (el libro va en data/raw/)
  etl:
    image: python:3.12-slim
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      PSEUDO_SALT: ${PSEUDO_SALT}
      XLSM_PATH: ${XLSM_PATH}
    volumes:
      - ./:/app
    command: sh -c "pip install -q -r etl/requirements.txt && python etl/run_etl.py"
    restart: "no"

  # lecturas hora a hora para el tablero: docker compose --profile simulador up simulador
  simulador:
    profiles: ["simulador"]
    image: python:3.12-slim
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
    volumes:
      - ./:/app
    command: sh -c "pip install -q -r etl/requirements.txt && python etl/simulador_hora.py --prefill 24 --segundos-por-hora 5"

volumes:
  pgdata:
  grafana-data:
