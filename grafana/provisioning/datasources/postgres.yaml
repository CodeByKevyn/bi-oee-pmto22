apiVersion: 1

datasources:
  - name: BI OEE PostgreSQL
    uid: bi-oee-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: ${PGHOST}:${PGPORT}
    user: ${GRAFANA_DB_USER}
    isDefault: true
    jsonData:
      database: ${PGDATABASE}
      sslmode: disable
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
